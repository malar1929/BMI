<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI Calculator</title>
  <style>
    :root {
      --bg: #f3f7ff;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --text: #1f2937;
      --muted: #6b7280;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --shadow: 0 18px 45px rgba(79, 70, 229, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      color: var(--text);
    }

    .app {
      width: min(90vw, 440px);
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 28px 24px 20px;
    }

    h1 {
      margin: 0 0 22px;
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      color: var(--primary-dark);
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--text);
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 16px 14px 42px;
      border: 2px solid #dbe3f0;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .unit {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 700;
      pointer-events: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #6d5efc);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 15px 20px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 20px rgba(79, 70, 229, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .result {
      margin-top: 22px;
      background: #f8faff;
      border: 1px solid #e6ecff;
      border-radius: 16px;
      padding: 18px 16px;
    }

    .result-title {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .bmi-value {
      font-size: clamp(2rem, 7vw, 2.8rem);
      font-weight: 800;
      color: var(--primary-dark);
      margin: 0;
    }

    .category {
      margin-top: 8px;
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--success);
    }

    .message {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.5;
    }

    .error {
      color: var(--danger);
      font-weight: 700;
      margin-top: 12px;
      display: none;
    }

    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>BMI Calculator</h1>

    <div class="input-group">
      <label for="weight">Weight</label>
      <div class="input-wrap">
        <span class="unit">kg</span>
        <input id="weight" type="number" min="1" step="0.1" placeholder="Enter your weight" />
      </div>
    </div>

    <div class="input-group">
      <label for="height">Height</label>
      <div class="input-wrap">
        <span class="unit">cm</span>
        <input id="height" type="number" min="1" step="0.1" placeholder="Enter your height" />
      </div>
    </div>

    <button type="button" onclick="calculateBMI()">Calculate BMI</button>

    <div class="result" aria-live="polite">
      <div class="result-title">Your BMI</div>
      <p class="bmi-value" id="bmiValue">--</p>
      <div class="category" id="category">-</div>
      <div class="message" id="message">Please enter your data to calculate.</div>
      <div class="error" id="errorMessage">Please enter valid weight and height.</div>
    </div>
  </div>

  <script>
    function calculateBMI() {
      const weightInput = document.getElementById('weight');
      const heightInput = document.getElementById('height');
      const bmiValue = document.getElementById('bmiValue');
      const category = document.getElementById('category');
      const message = document.getElementById('message');
      const errorMessage = document.getElementById('errorMessage');

      const weight = parseFloat(weightInput.value);
      const heightCm = parseFloat(heightInput.value);

      if (!weight || !heightCm || weight <= 0 || heightCm <= 0) {
        errorMessage.classList.add('show');
        bmiValue.textContent = '--';
        category.textContent = '-';
        message.textContent = 'Please enter your data to calculate.';
        return;
      }

      errorMessage.classList.remove('show');

      const heightM = heightCm / 100;
      const bmi = weight / (heightM * heightM);
      const roundedBMI = bmi.toFixed(1);

      let bmiCategory = '';
      let categoryColor = '#10b981';
      let guideText = '';

      if (bmi < 18.5) {
        bmiCategory = 'Underweight';
        categoryColor = '#f59e0b';
        guideText = 'You are below the healthy weight range. Consider a balanced diet and consult a healthcare professional if needed.';
      } else if (bmi < 25) {
        bmiCategory = 'Healthy Weight';
        categoryColor = '#10b981';
        guideText = 'Your weight is in the healthy range. Keep up the good habits!';
      } else if (bmi < 30) {
        bmiCategory = 'Overweight';
        categoryColor = '#f59e0b';
        guideText = 'You are slightly above the healthy range. A healthy routine and exercise can help.';
      } else {
        bmiCategory = 'Obesity';
        categoryColor = '#ef4444';
        guideText = 'Your BMI indicates obesity. It may be beneficial to speak with a healthcare professional for guidance.';
      }

      bmiValue.textContent = roundedBMI;
      category.textContent = bmiCategory;
      category.style.color = categoryColor;
      message.textContent = guideText;
    }
  </script>
</body>
</html>
